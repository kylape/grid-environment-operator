---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: aigrids.aigrid.llm.redhat.com
spec:
  group: aigrid.llm.redhat.com
  names:
    kind: AIGrid
    listKind: AIGridList
    plural: aigrids
    shortNames:
    - aig
    singular: aigrid
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="GridReady")].status
      name: Ready
      type: string
    - jsonPath: .status.ingressEndpointURL
      name: Endpoint
      type: string
    - jsonPath: .status.expirationTimestamp
      name: Expires
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AIGrid is a multi-site AI Grid environment: HyperShift LWE sites, the
          cross-site networking they need, and a GitOps-driven grid installation.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AIGridSpec defines the desired state of an AIGrid.
            properties:
              clusterQueue:
                description: |-
                  ClusterQueue is the Kueue ClusterQueue backing each site's
                  LocalQueue, separating this grid's capacity from others (e.g. CI
                  grids apart from interactive dev grids). Optional: when unset,
                  sites use the LWE operator's default (inference-workspaces).
                  The LWE API treats clusterQueue as immutable: changing it requires
                  removing and re-adding the site.
                type: string
              duration:
                description: |-
                  Duration is the requested lifetime of the grid's LWEs, in Go
                  time.Duration syntax. Defaults to 72h.
                type: string
              gitOps:
                description: GitOps identifies the repository the grid is installed
                  from.
                properties:
                  path:
                    description: |-
                      Path is the bootstrap directory within the repository containing
                      the root ApplicationSet (the fan-out that installs everything,
                      ACM included). Defaults to bootstrap/dedicated-hub.
                    type: string
                  repo:
                    description: Repo is the Git repository URL.
                    type: string
                  revision:
                    description: Revision is the Git revision to install from.
                    type: string
                required:
                - repo
                type: object
              ingressTLS:
                description: |-
                  IngressTLS optionally provides a CA that signs the ingress
                  endpoint's certificate, so clients can trust the CA once and reach
                  every grid's endpoint — instead of trusting each grid's cluster CA.
                  When unset, the ingress site's own ingress certificate is served.
                properties:
                  caSecretRef:
                    description: |-
                      CASecretRef names a Secret in the AIGrid's namespace containing a
                      CA certificate (key "ca.crt") and its private key (key "ca.key").
                      The operator signs a leaf certificate for the endpoint host with
                      this CA on each reconcile as needed. Use a dedicated lab CA: the
                      operator must read the private key to sign.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                required:
                - caSecretRef
                type: object
              peerGroup:
                description: |-
                  PeerGroup is the LWE peer-group label value applied to all LWEs.
                  Defaults to the AIGrid's name.
                type: string
                x-kubernetes-validations:
                - message: peerGroup is immutable
                  rule: self == oldSelf
              pullSecretRef:
                description: |-
                  PullSecretRef names the pull secret for all LWEs. It must be the
                  path-scoped composition: quay.io (console auth, openshift-release-dev)
                  and quay.io/rhoai (pre-release bundles) as separate keys.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              sites:
                description: |-
                  Sites are the grid's sites. Exactly one hub, at least one inference,
                  and at least one ingress site are required.
                items:
                  description: SiteSpec defines one grid site.
                  properties:
                    name:
                      description: |-
                        Name is the site's LWE name. Defaults to <grid-name>-<role>.
                        Must be at most 51 characters (HyperShift LWE namespace limit).
                      type: string
                    replicas:
                      description: Replicas is the desired number of KubeVirt worker
                        nodes.
                      format: int32
                      maximum: 100
                      minimum: 1
                      type: integer
                    role:
                      description: Role selects the site's responsibility within the
                        grid.
                      enum:
                      - hub
                      - inference
                      - ingress
                      type: string
                    size:
                      description: Size selects the HyperShift LWE worker size.
                      enum:
                      - small
                      - medium
                      - large
                      type: string
                  required:
                  - role
                  type: object
                maxItems: 16
                minItems: 3
                type: array
                x-kubernetes-validations:
                - message: exactly one hub site is required
                  rule: self.filter(s, s.role == 'hub').size() == 1
                - message: at least one inference site is required
                  rule: self.filter(s, s.role == 'inference').size() >= 1
                - message: at least one ingress site is required
                  rule: self.filter(s, s.role == 'ingress').size() >= 1
            required:
            - gitOps
            - pullSecretRef
            - sites
            type: object
          status:
            description: AIGridStatus is the observed state of an AIGrid.
            properties:
              conditions:
                description: |-
                  Conditions report grid-level phase progress:
                  Provisioned, Imported, Wired, GitOpsSynced, GridReady.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              dnsLweName:
                description: DNSLweName is the namespace-mode LWE hosting the zone
                  server.
                type: string
              expirationTimestamp:
                description: ExpirationTimestamp is the earliest LWE expiration in
                  the grid.
                format: date-time
                type: string
              ingressEndpointURL:
                description: |-
                  IngressEndpointURL is the consumer gateway's externally reachable
                  URL, set once the grid is ready.
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation most recently
                  reconciled.
                format: int64
                type: integer
              sites:
                description: Sites is the observed state of each site, in spec order.
                items:
                  description: SiteStatus is the observed state of one grid site.
                  properties:
                    appsDomain:
                      description: AppsDomain is the site's public apps domain.
                      type: string
                    gridSite:
                      description: |-
                        GridSite is the site's GridSite Connected condition, once the grid
                        is installed (the operator's end-to-end path probe).
                      type: string
                    kubeconfigSecret:
                      description: KubeconfigSecret names the secret holding this
                        site's kubeconfig.
                      type: string
                    lweName:
                      description: LWEName is the site's LWE resource name.
                      type: string
                    message:
                      description: |-
                        Message carries the blocking reason while the site is not ready,
                        taken from the LWE's own Ready condition — so `kubectl get aigrid`
                        answers "why is this stuck" without inspecting the LWE.
                      type: string
                    name:
                      description: Name is the resolved site name.
                      type: string
                    phase:
                      description: Phase is the site's progress through reconciliation.
                      type: string
                    role:
                      description: Role is the site's role.
                      enum:
                      - hub
                      - inference
                      - ingress
                      type: string
                  required:
                  - lweName
                  - name
                  - role
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
